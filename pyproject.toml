[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptguard"
version = "1.1.1"
description = "Security pre-flight for AI agents: catch prompt-injection and over-privileged tools before you ship."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "VictorLin" }]
keywords = [
    "ai-agents",
    "prompt-injection",
    "security",
    "mcp",
    "llm",
    "static-analysis",
    "linter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Hayatelin/promptguard"
Repository = "https://github.com/Hayatelin/promptguard"
Issues = "https://github.com/Hayatelin/promptguard/issues"

[project.scripts]
promptguard = "promptguard.cli:main"

[tool.setuptools]
packages = ["promptguard"]
